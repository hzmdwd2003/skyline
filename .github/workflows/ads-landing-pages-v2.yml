name: Optimize all Google Ads landing pages

on:
  push:
    paths:
      - '.github/workflows/ads-landing-pages-v2.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine landing pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse

          def wa(msg):
              return 'https://wa.me/491786287358?text=' + urllib.parse.quote(msg)

          css = '''<style id="ads-landing-v2">
          .ads-landing-hero{padding:62px 0 44px!important;background:radial-gradient(circle at 82% 18%,rgba(200,167,95,.13),transparent 30%),linear-gradient(180deg,rgba(255,255,255,.025),transparent)!important}.ads-hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(310px,.72fr);gap:38px;align-items:center}.ads-landing-hero h1{margin:16px 0 14px!important;font-family:Georgia,"Times New Roman",serif!important;font-size:clamp(2.05rem,4vw,3.3rem)!important;font-weight:500!important;letter-spacing:-.035em!important;line-height:1.04!important}.ads-lead{max-width:720px;color:#d5d5d5!important;font-size:1.03rem!important;margin:0!important}.ads-benefits{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.ads-benefit{padding:7px 11px;border-radius:999px;background:rgba(200,167,95,.12);border:1px solid rgba(241,216,145,.22);color:#f1d891;font-size:.84rem;font-weight:800}.ads-benefit:before{content:'✓ ';font-weight:900}.ads-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}.ads-wa,.ads-secondary{min-height:50px;padding:0 21px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:900}.ads-wa{background:#20c263;color:#06160b}.ads-secondary{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05)}.ads-card{padding:24px;border-radius:24px;background:#f4f0e8;color:#161616;box-shadow:0 22px 60px rgba(0,0,0,.28)}.ads-card h2{font-family:Georgia,"Times New Roman",serif;font-size:1.42rem;margin:0 0 8px}.ads-card .big{font-family:Georgia,"Times New Roman",serif;font-size:2.25rem;line-height:1;color:#705a29;margin:8px 0 10px}.ads-card p{color:#625f58!important;font-size:.91rem!important;margin:0 0 16px!important}.ads-card .ads-wa{width:100%}.ads-note{font-size:.75rem;color:#777168;text-align:center;margin-top:9px}.ads-trust{padding:15px 0;background:#0b0b0b;border-bottom:1px solid rgba(255,255,255,.08)}.ads-trust .container{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;color:#ddd;font-size:.85rem}.ads-trust strong{color:#f1d891}.xl-ad-intro{text-align:center;max-width:760px;margin:0 auto 34px}.xl-ad-intro h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:500;margin:10px 0}.xl-ad-intro p{color:#aaa;margin:0}@media(max-width:900px){.ads-hero-grid{grid-template-columns:1fr}.ads-card{max-width:620px}.ads-landing-hero{padding:48px 0 36px!important}}@media(max-width:680px){.ads-landing-hero h1{font-size:clamp(1.85rem,9vw,2.55rem)!important}.ads-actions>a{width:100%}.ads-card{padding:19px}.ads-benefit{font-size:.78rem}}
          </style>'''
          conversion='''<script id="ads-conversion-v2">document.querySelectorAll('a[href*="wa.me/491786287358"]').forEach(function(a){a.addEventListener('click',function(){if(typeof gtag==='function'){gtag('event','conversion',{'send_to':'AW-18306707563/na3pCNqYx98cEOvgqJlE'});}});});</script>'''

          pages={
          'leistungen.html':('Flughafentransfer Frankfurt | Leistungen & XL Transfer | Skyline Drive','Günstiger und stressfreier Flughafentransfer Frankfurt. Festpreis vorab, Kindersitz und XL Transfer für Familien und Gruppen.','Flughafentransfer Frankfurt','Einfach, günstig und stressfrei zum Flughafen Frankfurt.','Direkte Fahrten zum oder vom Frankfurt Airport – mit Festpreis vorab, schneller WhatsApp-Anfrage und passenden Fahrzeugen für Einzelreisende, Familien und Gruppen.',['Festpreis vorab','Direkte Fahrt','Kindersitz möglich','XL für Familien & Gruppen'],'Flughafentransfer direkt anfragen','ab 30 €','Abholort, Ziel und Reisedaten senden. Sie erhalten Preis und Verfügbarkeit.','Hallo Skyline Drive, ich möchte einen günstigen Flughafentransfer zum oder vom Flughafen Frankfurt anfragen.','preise.html','Preise ansehen'),
          'preise.html':('Flughafentransfer Frankfurt Preise | Festpreis ab 30 € | Skyline Drive','Flughafentransfer Frankfurt zum Festpreis. Beliebte Direktfahrten ab 30 €, XL Transfer für Familien und Gruppen auf Anfrage.','Festpreise Flughafen Frankfurt','Flughafentransfer zum Festpreis – ohne Überraschungen.','Beliebte Preise für Fahrten zum und vom Frankfurt Airport. Ihren persönlichen Gesamtpreis erhalten Sie vor der Fahrt – einfach per WhatsApp.',['ab 30 €','Preis vor der Fahrt','Direkt zum Terminal','XL Transfer möglich'],'Persönlichen Festpreis erhalten','ab 30 €','Senden Sie Abholort, Ziel, Datum, Uhrzeit, Personen und Gepäck. Wir nennen Ihnen den passenden Festpreis.','Hallo Skyline Drive, ich möchte meinen Festpreis für einen Flughafentransfer zum oder vom Flughafen Frankfurt anfragen.','xl-transfer.html','XL Transfer ansehen'),
          'flotte.html':('Flughafentransfer Frankfurt Fahrzeuge | Pkw, Touran & Vito | Skyline Drive','Passende Fahrzeuge für Flughafentransfer Frankfurt: Pkw, VW Touran und Mercedes Vito für Familien, Gruppen und Gepäck.','Fahrzeuge für Ihre Flughafenfahrt','Das passende Fahrzeug für Personen und Gepäck.','Ob allein, als Familie oder Gruppe: Wir planen das Fahrzeug passend zur Personenzahl und zum Gepäck – bequem zum oder vom Frankfurt Airport.',['Komfortable Pkw','Familienfahrzeuge','XL bis 8 Personen','Platz für Gepäck'],'Passendes Fahrzeug anfragen','Pkw bis XL','Teilen Sie uns Personenanzahl und Gepäck mit. Wir wählen die passende Fahrzeuggröße für Ihre Fahrt.','Hallo Skyline Drive, ich möchte einen Flughafentransfer anfragen. Bitte planen Sie das passende Fahrzeug nach Personen und Gepäck.','xl-transfer.html','XL Transfer für Gruppen')}
          trust='<div class="ads-trust"><div class="container"><span><strong>Festpreis</strong> vorab</span><span>Direktfahrt ohne Umsteigen</span><span>Schnelle WhatsApp-Anfrage</span><span>Familien &amp; Gruppen möglich</span></div></div>'

          for fn,d in pages.items():
              p=Path(fn);t=p.read_text(encoding='utf-8')
              title,desc,eye,h1,lead,benefits,ct,big,card,msg,secondary,secondary_text=d
              t=re.sub(r'<title>.*?</title>',f'<title>{title}</title>',t,count=1,flags=re.S)
              t=re.sub(r'<meta name="description" content=".*?">',f'<meta name="description" content="{desc}">',t,count=1,flags=re.S)
              if 'id="ads-landing-v2"' not in t:t=t.replace('</head>',css+'\n</head>',1)
              chips=''.join('<span class="ads-benefit">'+x+'</span>' for x in benefits)
              hero=f'<header class="page-hero ads-landing-hero"><div class="container ads-hero-grid"><div><div class="eyebrow">{eye}</div><h1>{h1}</h1><p class="ads-lead">{lead}</p><div class="ads-benefits">{chips}</div><div class="ads-actions"><a class="ads-wa" href="{wa(msg)}" target="_blank" rel="noopener">Preis per WhatsApp anfragen</a><a class="ads-secondary" href="{secondary}">{secondary_text}</a></div></div><aside class="ads-card"><h2>{ct}</h2><div class="big">{big}</div><p>{card}</p><a class="ads-wa" href="{wa(msg)}" target="_blank" rel="noopener">Jetzt unverbindlich anfragen</a><div class="ads-note">Keine automatische Buchung – zuerst Preis &amp; Verfügbarkeit.</div></aside></div></header>'
              t,n=re.subn(r'<header class="page-hero[^>]*>.*?</header>',hero,t,count=1,flags=re.S)
              if 'class="ads-trust"' not in t:t=t.replace(hero,hero+trust,1)
              if 'id="ads-conversion-v2"' not in t and 'na3pCNqYx98cEOvgqJlE' not in t:t=t.replace('</body>',conversion+'\n</body>',1)
              p.write_text(t,encoding='utf-8')

          p=Path('xl-transfer.html');t=p.read_text(encoding='utf-8')
          t=re.sub(r'<title>.*?</title>','<title>XL Flughafentransfer Frankfurt | Bis 8 Personen | Skyline Drive</title>',t,count=1,flags=re.S)
          t=re.sub(r'<meta name="description" content=".*?">','<meta name="description" content="XL Flughafentransfer Frankfurt für Familien und Gruppen. Mercedes Vito bis 8 Personen, VW Touran bis 6 Personen, viel Gepäck und direkte WhatsApp-Anfrage.">',t,count=1,flags=re.S)
          if 'id="ads-landing-v2"' not in t:t=t.replace('</head>',css+'\n</head>',1)
          msg='Hallo Skyline Drive, ich möchte einen XL Flughafentransfer für meine Familie oder Gruppe anfragen. Bitte senden Sie mir Preis und Verfügbarkeit.'
          hero=f'<header class="page-hero ads-landing-hero"><div class="container ads-hero-grid"><div><div class="eyebrow">XL Flughafentransfer Frankfurt</div><h1>Gemeinsam, bequem und stressfrei zum Flughafen.</h1><p class="ads-lead">XL Transfer für Familien und Gruppen mit viel Gepäck. Mercedes Vito für bis zu 8 Personen oder VW Touran für bis zu 6 Personen – direkt zum oder vom Frankfurt Airport.</p><div class="ads-benefits"><span class="ads-benefit">Bis zu 8 Personen</span><span class="ads-benefit">Viel Gepäck</span><span class="ads-benefit">Festpreis vorab</span><span class="ads-benefit">Direkte Fahrt</span></div><div class="ads-actions"><a class="ads-wa" href="{wa(msg)}" target="_blank" rel="noopener">XL Preis per WhatsApp anfragen</a><a class="ads-secondary" href="#xl-fahrzeuge">Fahrzeuge ansehen</a></div></div><aside class="ads-card"><h2>XL Transfer direkt anfragen</h2><div class="big">bis 8 Personen</div><p>Abholort, Ziel, Datum, Uhrzeit, Personen und Gepäck senden. Wir antworten mit Fahrzeug, Preis und Verfügbarkeit.</p><a class="ads-wa" href="{wa(msg)}" target="_blank" rel="noopener">Jetzt XL Transfer anfragen</a><div class="ads-note">Unverbindlich – keine automatische Buchung.</div></aside></div></header>'
          t,n=re.subn(r'<header class="page-hero[^>]*>.*?</header>',hero,t,count=1,flags=re.S)
          if 'class="ads-trust"' not in t:t=t.replace(hero,hero+'<div class="ads-trust"><div class="container"><span><strong>Vito:</strong> bis 8 Personen</span><span><strong>Touran:</strong> bis 6 Personen</span><span>Festpreis vorab</span><span>Direkt zum/vom FRA</span></div></div>',1)
          if 'id="xl-fahrzeuge"' not in t:t=t.replace('<section class="section">','<section class="section" id="xl-fahrzeuge"><div class="container"><div class="xl-ad-intro"><div class="eyebrow">XL Fahrzeuge</div><h2>Ein Fahrzeug für die ganze Familie oder Gruppe.</h2><p>Personen und Gepäck mitteilen – wir planen Vito oder Touran passend zu Ihrer Fahrt.</p></div></div>',1)
          if 'id="ads-conversion-v2"' not in t and 'na3pCNqYx98cEOvgqJlE' not in t:t=t.replace('</body>',conversion+'\n</body>',1)
          p.write_text(t,encoding='utf-8')

          p=Path('index.html');t=p.read_text(encoding='utf-8')
          t=re.sub(r'<title>.*?</title>','<title>Flughafentransfer Frankfurt | Günstig &amp; stressfrei | Skyline Drive</title>',t,count=1,flags=re.S)
          t=re.sub(r'<meta name="description" content=".*?">','<meta name="description" content="Günstiger und stressfreier Flughafentransfer Frankfurt ab 30 €. Festpreis vorab, direkte WhatsApp-Anfrage und XL Transfer für Familien und Gruppen.">',t,count=1,flags=re.S)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html leistungen.html preise.html flotte.html xl-transfer.html
          git commit -m "Align all landing pages with Google Ads intent" || exit 0
          git push
