name: Optimize all Google Ads landing pages

on:
  push:
    paths:
      - '.github/workflows/ads-landing-pages-v2.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine landing pages for conversion intent
        shell: python
        run: |
          from pathlib import Path
          import re
          import urllib.parse

          wa_base = 'https://wa.me/491786287358?text='
          def wa(msg):
              return wa_base + urllib.parse.quote(msg)

          common_css = r'''
<style id="ads-landing-v2">
/* Conversion-focused landing page layer: simple, relevant, mobile-first */
.ads-landing-hero{padding:64px 0 46px!important;background:radial-gradient(circle at 82% 18%,rgba(200,167,95,.13),transparent 30%),linear-gradient(180deg,rgba(255,255,255,.025),transparent)!important}
.ads-landing-hero .ads-hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.72fr);gap:38px;align-items:center}
.ads-landing-hero h1{margin:16px 0 14px!important;font-family:Georgia,"Times New Roman",serif!important;font-size:clamp(2.05rem,4vw,3.35rem)!important;font-weight:500!important;letter-spacing:-.035em!important;line-height:1.04!important;max-width:820px}
.ads-landing-hero .ads-lead{max-width:720px;color:#d5d5d5;font-size:1.03rem;margin:0}
.ads-benefits{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 0}
.ads-benefit{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:rgba(200,167,95,.12);border:1px solid rgba(241,216,145,.22);color:#f1d891;font-size:.84rem;font-weight:800}
.ads-benefit:before{content:'✓';font-weight:900}
.ads-hero-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}
.ads-primary-wa{background:#20c263!important;color:#06160b!important;min-height:50px!important;padding:0 22px!important;border-radius:999px!important;font-weight:900!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;text-decoration:none!important}
.ads-secondary{min-height:50px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.ads-conversion-card{padding:24px;border-radius:24px;background:#f4f0e8;color:#161616;box-shadow:0 22px 60px rgba(0,0,0,.28)}
.ads-conversion-card .ads-price{font-family:Georgia,"Times New Roman",serif;font-size:2.35rem;line-height:1;color:#705a29;margin:8px 0 10px}
.ads-conversion-card h2{font-family:Georgia,"Times New Roman",serif;font-size:1.42rem;margin:0 0 8px;line-height:1.12}
.ads-conversion-card p{margin:0 0 16px!important;color:#625f58!important;font-size:.91rem!important}
.ads-conversion-card .ads-primary-wa{width:100%;min-height:48px!important}
.ads-mini-note{font-size:.76rem;color:#777168;margin-top:9px;text-align:center}
.ads-trust-row{padding:16px 0;border-bottom:1px solid rgba(255,255,255,.08);background:#0b0b0b}
.ads-trust-row .container{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;color:#ddd;font-size:.86rem}
.ads-trust-row strong{color:#f1d891}
@media(max-width:900px){.ads-landing-hero .ads-hero-grid{grid-template-columns:1fr}.ads-conversion-card{max-width:620px}.ads-landing-hero{padding:48px 0 36px!important}}
@media(max-width:680px){.ads-landing-hero h1{font-size:clamp(1.85rem,9vw,2.55rem)!important}.ads-hero-actions>a{width:100%}.ads-benefits{gap:7px}.ads-benefit{font-size:.78rem}.ads-conversion-card{padding:19px}.ads-trust-row .container{gap:10px 18px;font-size:.8rem}}
</style>
'''

          conversion_js = r'''
<script id="ads-conversion-v2">
document.querySelectorAll('a[href*="wa.me/491786287358"]').forEach(function(link){
  link.addEventListener('click', function(){
    if (typeof gtag === 'function') {
      gtag('event', 'conversion', {'send_to':'AW-18306707563/na3pCNqYx98cEOvgqJlE'});
    }
  });
});
</script>
'''

          page_data = {
            'leistungen.html': {
              'title':'Flughafentransfer Frankfurt | Leistungen & XL Transfer | Skyline Drive',
              'desc':'Günstiger und stressfreier Flughafentransfer Frankfurt. Festpreis vorab, Kindersitz auf Anfrage und XL Transfer für Familien und Gruppen.',
              'eyebrow':'Flughafentransfer Frankfurt',
              'h1':'Einfach, günstig und stressfrei zum Flughafen Frankfurt.',
              'lead':'Direkte Flughafenfahrten zum oder vom Frankfurt Airport – mit Festpreis vorab, schneller WhatsApp-Anfrage und passenden Fahrzeugen für Einzelreisende, Familien und Gruppen.',
              'benefits':['Festpreis vorab','Direkte Fahrt','Kindersitz möglich','XL für Familien & Gruppen'],
              'card_title':'Flughafentransfer direkt anfragen',
              'card_price':'ab 30 €',
              'card_text':'Abholort, Ziel und Reisedaten senden. Sie erhalten schnell eine Rückmeldung mit Verfügbarkeit und Preis.',
              'msg':'Hallo Skyline Drive, ich möchte einen günstigen Flughafentransfer zum oder vom Flughafen Frankfurt anfragen.',
              'secondary':'preise.html',
              'secondary_text':'Preise ansehen'
            },
            'preise.html': {
              'title':'Flughafentransfer Frankfurt Preise | Festpreis ab 30 € | Skyline Drive',
              'desc':'Flughafentransfer Frankfurt zum Festpreis. Beliebte Direktfahrten ab 30 €, XL Transfer für Familien und Gruppen auf Anfrage.',
              'eyebrow':'Festpreise Flughafen Frankfurt',
              'h1':'Flughafentransfer zum Festpreis – ohne Überraschungen.',
              'lead':'Sehen Sie beliebte Preise für Fahrten zum und vom Frankfurt Airport. Ihren persönlichen Gesamtpreis erhalten Sie vor der Fahrt – einfach per WhatsApp anfragen.',
              'benefits':['ab 30 €','Preis vor der Fahrt','Direkt zum Terminal','XL Transfer möglich'],
              'card_title':'Persönlichen Festpreis erhalten',
              'card_price':'ab 30 €',
              'card_text':'Senden Sie Abholort, Ziel, Datum, Uhrzeit, Personen und Gepäck. Wir nennen Ihnen den passenden Festpreis.',
              'msg':'Hallo Skyline Drive, ich möchte meinen Festpreis für einen Flughafentransfer zum oder vom Flughafen Frankfurt anfragen.',
              'secondary':'xl-transfer.html',
              'secondary_text':'XL Transfer ansehen'
            },
            'flotte.html': {
              'title':'Flughafentransfer Frankfurt Fahrzeuge | Pkw, Touran & Vito | Skyline Drive',
              'desc':'Passende Fahrzeuge für Flughafentransfer Frankfurt: komfortable Pkw, VW Touran und Mercedes Vito für Familien, Gruppen und viel Gepäck.',
              'eyebrow':'Fahrzeuge für Ihre Flughafenfahrt',
              'h1':'Das passende Fahrzeug für Personen und Gepäck.',
              'lead':'Ob allein, als Familie oder größere Gruppe: Wir planen das Fahrzeug passend zur Personenzahl und zum Gepäck – bequem zum oder vom Frankfurt Airport.',
              'benefits':['Komfortable Pkw','Familienfahrzeuge','XL bis 8 Personen','Platz für Gepäck'],
              'card_title':'Passendes Fahrzeug anfragen',
              'card_price':'Pkw bis XL',
              'card_text':'Teilen Sie uns Personenanzahl und Gepäck mit. Wir wählen die passende Fahrzeuggröße für Ihre Flughafenfahrt.',
              'msg':'Hallo Skyline Drive, ich möchte einen Flughafentransfer anfragen. Bitte planen Sie das passende Fahrzeug nach Personen und Gepäck.',
              'secondary':'xl-transfer.html',
              'secondary_text':'XL Transfer für Gruppen'
            },
          }

          trust = '''<div class="ads-trust-row"><div class="container"><span><strong>Festpreis</strong> vorab</span><span>Direktfahrt ohne Umsteigen</span><span>WhatsApp-Anfrage in wenigen Schritten</span><span>Familien &amp; Gruppen möglich</span></div></div>'''

          for filename, d in page_data.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'<title>.*?</title>', f'<title>{d["title"]}</title>', text, count=1, flags=re.S)
              text = re.sub(r'<meta name="description" content=".*?">', f'<meta name="description" content="{d["desc"]}">', text, count=1, flags=re.S)
              if 'id="ads-landing-v2"' not in text:
                  text = text.replace('</head>', common_css + '\n</head>', 1)
              benefits = ''.join(f'<span class="ads-benefit">{x}</span>' for x in d['benefits'])
              hero = f'''<header class="page-hero ads-landing-hero"><div class="container ads-hero-grid"><div><div class="eyebrow">{d['eyebrow']}</div><h1>{d['h1']}</h1><p class="ads-lead">{d['lead']}</p><div class="ads-benefits">{benefits}</div><div class="ads-hero-actions"><a class="ads-primary-wa" href="{wa(d['msg'])}" target="_blank" rel="noopener">Preis per WhatsApp anfragen</a><a class="ads-secondary" href="{d['secondary']}">{d['secondary_text']}</a></div></div><aside class="ads-conversion-card"><h2>{d['card_title']}</h2><div class="ads-price">{d['card_price']}</div><p>{d['card_text']}</p><a class="ads-primary-wa" href="{wa(d['msg'])}" target="_blank" rel="noopener">Jetzt unverbindlich anfragen</a><div class="ads-mini-note">Keine automatische Buchung – Sie erhalten zuerst Preis &amp; Verfügbarkeit.</div></aside></div></header>'''
              text, n = re.subn(r'<header class="page-hero">.*?</header>', hero, text, count=1, flags=re.S)
              if n == 0:
                  text = re.sub(r'<header class="page-hero[^>]*>.*?</header>', hero, text, count=1, flags=re.S)
              if 'ads-trust-row' not in text:
                  text = text.replace(hero, hero + trust, 1)
              if 'id="ads-conversion-v2"' not in text and 'na3pCNqYx98cEOvgqJlE' not in text:
                  text = text.replace('</body>', conversion_js + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')

          # XL page gets the strongest, dedicated ad-to-landing alignment.
          p = Path('xl-transfer.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'<title>.*?</title>', '<title>XL Flughafentransfer Frankfurt | Bis 8 Personen | Skyline Drive</title>', text, count=1, flags=re.S)
          text = re.sub(r'<meta name="description" content=".*?">', '<meta name="description" content="XL Flughafentransfer Frankfurt für Familien und Gruppen. Mercedes Vito bis 8 Personen, VW Touran bis 6 Personen, viel Gepäck und direkte WhatsApp-Anfrage.">', text, count=1, flags=re.S)
          if 'id="ads-landing-v2"' not in text:
              text = text.replace('</head>', common_css + '\n</head>', 1)
          xl_extra = r'''
<style id="xl-ads-focus-v2">
.xl-ad-note{margin-top:16px;color:#cfcfcf;font-size:.9rem}
.xl-vehicles-intro{text-align:center;max-width:760px;margin:0 auto 34px}
.xl-vehicles-intro h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(1.8rem,3vw,2.55rem);margin:10px 0}
.xl-vehicles-intro p{color:#aaa;margin:0}
.xl-wrap{max-width:1120px;margin-left:auto;margin-right:auto}
.xl-copy h2{margin-bottom:12px}
.xl-copy .xl-facts{display:flex!important;margin:18px 0 22px!important}
.xl-copy .btn,.xl-copy .btn-wa{min-height:48px}
#xl-touran{padding-top:78px!important}
@media(max-width:900px){#xl-touran{padding-top:54px!important}}
</style>
'''
          if 'id="xl-ads-focus-v2"' not in text:
              text = text.replace('</head>', xl_extra + '\n</head>', 1)
          xl_msg = 'Hallo Skyline Drive, ich möchte einen XL Flughafentransfer für meine Familie oder Gruppe anfragen. Bitte senden Sie mir Preis und Verfügbarkeit.'
          xl_hero = f'''<header class="page-hero ads-landing-hero"><div class="container ads-hero-grid"><div><div class="eyebrow">XL Flughafentransfer Frankfurt</div><h1>Gemeinsam, bequem und stressfrei zum Flughafen.</h1><p class="ads-lead">XL Transfer für Familien und Gruppen mit viel Gepäck. Mit Mercedes Vito für bis zu 8 Personen oder VW Touran für bis zu 6 Personen – direkt zum oder vom Frankfurt Airport.</p><div class="ads-benefits"><span class="ads-benefit">Bis zu 8 Personen</span><span class="ads-benefit">Viel Platz für Gepäck</span><span class="ads-benefit">Festpreis vorab</span><span class="ads-benefit">Direkte Fahrt</span></div><div class="ads-hero-actions"><a class="ads-primary-wa" href="{wa(xl_msg)}" target="_blank" rel="noopener">XL Preis per WhatsApp anfragen</a><a class="ads-secondary" href="#xl-fahrzeuge">Fahrzeuge ansehen</a></div><div class="xl-ad-note">Ideal für Familien, Gruppen, mehrere Koffer, Kinderwagen oder gemeinsame Flughafenfahrten.</div></div><aside class="ads-conversion-card"><h2>XL Transfer direkt anfragen</h2><div class="ads-price">bis 8 Personen</div><p>Schicken Sie Abholort, Ziel, Datum, Uhrzeit, Personenanzahl und Gepäck. Wir antworten mit passendem Fahrzeug, Preis und Verfügbarkeit.</p><a class="ads-primary-wa" href="{wa(xl_msg)}" target="_blank" rel="noopener">Jetzt XL Transfer anfragen</a><div class="ads-mini-note">Unverbindlich anfragen – keine automatische Buchung.</div></aside></div></header>'''
          text, n = re.subn(r'<header class="page-hero">.*?</header>', xl_hero, text, count=1, flags=re.S)
          if n == 0:
              text = re.sub(r'<header class="page-hero[^>]*>.*?</header>', xl_hero, text, count=1, flags=re.S)
          if 'ads-trust-row' not in text:
              text = text.replace(xl_hero, xl_hero + '<div class="ads-trust-row"><div class="container"><span><strong>Vito:</strong> bis 8 Personen</span><span><strong>Touran:</strong> bis 6 Personen</span><span>Festpreis vorab</span><span>Direkt zum/vom FRA</span></div></div>', 1)
          # Mark vehicle area for the hero anchor and add a short intent-setting intro.
          first_section = '<section class="section">'
          if first_section in text and 'id="xl-fahrzeuge"' not in text:
              intro = '<section class="section" id="xl-fahrzeuge"><div class="container"><div class="xl-vehicles-intro"><div class="eyebrow">XL Fahrzeuge</div><h2>Ein Fahrzeug für die ganze Familie oder Gruppe.</h2><p>Wählen Sie nicht kompliziert selbst: Teilen Sie uns Personen und Gepäck mit – wir planen Vito oder Touran passend zu Ihrer Fahrt.</p></div></div>'
              text = text.replace(first_section, intro, 1)
          # Make the first Vito CTA wording more direct wherever possible.
          text = text.replace('XL Transfer anfragen</span>', 'XL Transfer jetzt anfragen</span>')
          text = text.replace('XL Transfer anfragen</a>', 'XL Transfer jetzt anfragen</a>')
          if 'id="ads-conversion-v2"' not in text and 'na3pCNqYx98cEOvgqJlE' not in text:
              text = text.replace('</body>', conversion_js + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')

          # Homepage: preserve the current optimized structure, only ensure subpage messaging is reflected in metadata.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'<title>.*?</title>', '<title>Flughafentransfer Frankfurt | Günstig & stressfrei | Skyline Drive</title>', text, count=1, flags=re.S)
          text = re.sub(r'<meta name="description" content=".*?">', '<meta name="description" content="Günstiger und stressfreier Flughafentransfer Frankfurt ab 30 €. Festpreis vorab, direkte WhatsApp-Anfrage und XL Transfer für Familien und Gruppen.">', text, count=1, flags=re.S)
          p.write_text(text, encoding='utf-8')

      - name: Commit landing page improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html leistungen.html preise.html flotte.html xl-transfer.html
          git commit -m "Align all landing pages with Google Ads intent" || exit 0
          git push
