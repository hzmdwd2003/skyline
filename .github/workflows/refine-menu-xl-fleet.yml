name: Refine menu XL fleet

on:
  push:
    paths:
      - '.github/workflows/refine-menu-xl-fleet.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              'index.html','leistungen.html','preise.html','flotte.html',
              'xl-transfer.html','datenschutz.html','impressum.html'
          ]

          menu_css = '''
          <style id="menu-breakpoint-fix-20260811">
          /* Restore hamburger menu before the header can become crowded */
          @media (max-width:1320px){
            .nav-inner{min-height:84px!important}
            .menu-btn{display:inline-grid!important;place-items:center!important;flex:0 0 44px!important}
            .nav-links{
              display:none!important;
              position:absolute!important;
              top:84px!important;
              left:17px!important;
              right:17px!important;
              z-index:120!important;
              flex-direction:column!important;
              align-items:stretch!important;
              gap:10px!important;
              padding:18px!important;
              border-radius:18px!important;
              background:#111!important;
              border:1px solid rgba(255,255,255,.12)!important;
              box-shadow:0 20px 50px rgba(0,0,0,.35)!important;
            }
            .nav-links.open{display:flex!important}
            .nav-links>a{padding:8px 4px!important;white-space:normal!important}
            .nav-whatsapp{display:inline-flex!important}
          }
          @media (max-width:680px){
            .nav-inner{min-height:76px!important}
            .nav-links{top:76px!important}
          }
          </style>
          '''

          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if 'menu-breakpoint-fix-20260811' not in text:
                  text = text.replace('</head>', menu_css + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')

          # Fleet: keep wording/content unchanged; only refine image presentation.
          p = Path('flotte.html')
          text = p.read_text(encoding='utf-8')
          fleet_css = '''
          <style id="fleet-rounded-images-20260811">
          .fleet-card{overflow:hidden!important}
          .fleet-card img{
            width:calc(100% - 24px)!important;
            height:292px!important;
            margin:12px 12px 0!important;
            padding:8px 10px!important;
            object-fit:contain!important;
            object-position:center!important;
            border-radius:20px!important;
            overflow:hidden!important;
          }
          @media(max-width:680px){
            .fleet-card img{
              width:calc(100% - 20px)!important;
              height:235px!important;
              margin:10px 10px 0!important;
              padding:7px 8px!important;
              border-radius:17px!important;
            }
          }
          </style>
          '''
          if 'fleet-rounded-images-20260811' not in text:
              text = text.replace('</head>', fleet_css + '\n</head>', 1)
          p.write_text(text, encoding='utf-8')

          # XL page: remove the top person/luggage pills and move them to Vito details.
          p = Path('xl-transfer.html')
          text = p.read_text(encoding='utf-8')
          # Remove only the hero fact bubbles.
          text = re.sub(
              r'<div class="xl-facts"><span class="fact">Bis zu 8 Personen</span><span class="fact">4–6 Koffer</span><span class="fact">Mercedes Vito</span></div>',
              '', text, count=1
          )
          # Insert Vito person/luggage bubbles before the Vito enquiry button, only if absent there.
          vito_marker = '<a class="btn btn-wa xl-conv" href="https://wa.me/491786287358?text=Hallo%20Skyline%20Drive%2C%20ich%20m%C3%B6chte%20den%20XL%20Transfer%20f%C3%BCr%20meine%20Flughafenfahrt%20anfragen."'
          if '<span class="fact">8 Personen</span><span class="fact">4–6 Koffer</span>' not in text:
              text = text.replace(
                  vito_marker,
                  '<div class="xl-facts"><span class="fact">8 Personen</span><span class="fact">4–6 Koffer</span></div>' + vito_marker,
                  1
              )
          xl_css = '''
          <style id="xl-layout-spacing-20260811">
          .page-hero .xl-facts{display:none!important}
          .xl-wrap{gap:56px!important;align-items:center!important}
          .xl-copy{padding:22px 0!important;min-width:0!important}
          .xl-copy .xl-facts{display:flex!important;margin:20px 0 22px!important;gap:10px!important;flex-wrap:wrap!important}
          .xl-copy .btn{margin-top:0!important}
          #xl-touran{margin-top:18px!important;border-top:1px solid rgba(255,255,255,.07)!important}
          @media(max-width:900px){
            .xl-wrap{gap:28px!important}
            .xl-copy{padding:4px 0 12px!important}
          }
          </style>
          '''
          if 'xl-layout-spacing-20260811' not in text:
              text = text.replace('</head>', xl_css + '\n</head>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit website refinements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html leistungen.html preise.html flotte.html xl-transfer.html datenschutz.html impressum.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore hamburger menu and refine XL and fleet layout"
            git push origin main
          fi
