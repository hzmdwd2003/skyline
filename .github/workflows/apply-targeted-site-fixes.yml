name: Apply targeted website fixes

on:
  push:
    paths:
      - '.github/workflows/apply-targeted-site-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested HTML fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              'index.html', 'leistungen.html', 'preise.html', 'flotte.html',
              'datenschutz.html', 'impressum.html', 'xl-transfer.html'
          ]

          header_fix = r'''
          /* header-collision-fix-20260811 */
          @media (min-width:1181px){
            .nav .container{width:min(calc(100% - 32px),1480px)!important}
            .nav-inner{min-height:106px!important;gap:18px!important}
            .brand{gap:14px!important;flex:0 1 auto!important;min-width:0!important}
            .brand-monogram{width:108px!important;height:64px!important;flex:0 0 108px!important}
            .brand strong{font-size:.9rem!important;letter-spacing:.055em!important;white-space:nowrap!important}
            .brand-copy>span{font-size:.68rem!important;letter-spacing:.045em!important;white-space:nowrap!important}
            .nav-links{margin-left:auto!important;gap:15px!important;font-size:.86rem!important;white-space:nowrap!important;flex-wrap:nowrap!important}
            .nav-links>a{white-space:nowrap!important}
            .nav-whatsapp{display:none!important}
          }
          @media (min-width:1181px) and (max-width:1320px){
            .brand-monogram{width:98px!important;height:60px!important;flex-basis:98px!important}
            .brand{gap:10px!important}
            .brand strong{font-size:.82rem!important;letter-spacing:.04em!important}
            .brand-copy>span{font-size:.62rem!important;letter-spacing:.03em!important}
            .nav-links{gap:10px!important;font-size:.79rem!important}
          }
          @media (max-width:1180px){
            .nav-inner{min-height:84px!important}
            .menu-btn{display:inline-grid!important;place-items:center!important}
            .nav-links{display:none!important;position:absolute!important;top:84px!important;left:17px!important;right:17px!important;flex-direction:column!important;align-items:stretch!important;padding:18px!important;border-radius:18px!important;background:#111!important;border:1px solid rgba(255,255,255,.12)!important;z-index:100!important}
            .nav-links.open{display:flex!important}
            .nav-whatsapp{display:inline-flex!important}
          }
          @media (max-width:680px){
            .nav-inner{min-height:76px!important}
            .nav-links{top:76px!important}
          }
          '''

          def add_css(text, css):
              if 'header-collision-fix-20260811' in text:
                  return text
              pos = text.rfind('</style>')
              if pos == -1:
                  return text
              return text[:pos] + '\n' + css + '\n' + text[pos:]

          # Header: same non-overlapping behavior on homepage and every subpage.
          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = add_css(text, header_fix)
              p.write_text(text, encoding='utf-8')

          # Homepage white shortcut cards: internal navigation and no car silhouettes.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          silhouette_css = '''
          /* remove-home-shortcut-silhouettes-20260811 */
          .trust-visual{display:none!important}
          .trust-item::before,.trust-item::after{content:none!important;display:none!important;background:none!important;background-image:none!important}
          '''
          if 'remove-home-shortcut-silhouettes-20260811' not in text:
              pos = text.rfind('</style>')
              if pos != -1:
                  text = text[:pos] + '\n' + silhouette_css + '\n' + text[pos:]

          grid = re.search(r'(<div class="trust-grid">)(.*?)(</div>\s*</div>\s*</div>)', text, re.S)
          if grid:
              inner = grid.group(2)
              tags = list(re.finditer(r'<a class="trust-item[^"]*"[^>]*>', inner))[:4]
              replacements = [
                  '<a class="trust-item" href="leistungen.html" aria-label="Leistungen Flughafentransfer Frankfurt">',
                  '<a class="trust-item" href="leistungen.html" aria-label="Leistungen Frankfurt Hahn">',
                  '<a class="trust-item" href="xl-transfer.html" aria-label="XL Flughafentransfer 7-Sitzer">',
                  '<a class="trust-item" href="xl-transfer.html" aria-label="XL Flughafentransfer 9-Sitzer">',
              ]
              if len(tags) == 4:
                  rebuilt = inner
                  for m, rep in reversed(list(zip(tags, replacements))):
                      rebuilt = rebuilt[:m.start()] + rep + rebuilt[m.end():]
                  text = text[:grid.start(2)] + rebuilt + text[grid.end(2):]
          p.write_text(text, encoding='utf-8')

          # Flotte: ONLY adjust vehicle image scale/space; keep all wording and cards unchanged.
          p = Path('flotte.html')
          text = p.read_text(encoding='utf-8')
          fleet_css = '''
          /* fleet-image-size-fix-20260811 */
          .fleet-card img{height:300px!important;object-fit:contain!important;object-position:center!important;padding:6px 8px 0!important}
          @media(max-width:680px){.fleet-card img{height:240px!important;padding:5px 7px 0!important}}
          '''
          if 'fleet-image-size-fix-20260811' not in text:
              pos = text.rfind('</style>')
              if pos != -1:
                  text = text[:pos] + '\n' + fleet_css + '\n' + text[pos:]
          p.write_text(text, encoding='utf-8')

          # XL page: add VW Touran below the existing Mercedes Vito section using fleet information.
          p = Path('xl-transfer.html')
          text = p.read_text(encoding='utf-8')
          if 'id="xl-touran"' not in text:
              touran = '''
          <section class="section" id="xl-touran">
            <div class="container xl-wrap">
              <div class="xl-image"><img src="assets/ChatGPT%20Image%208.%20Juli%202026%2C%2017_30_13%20%286%29.png" alt="VW Touran XL Flughafentransfer" loading="lazy"></div>
              <div class="xl-copy">
                <div class="eyebrow">VW Touran</div>
                <h2>Flexibler Familienwagen mit viel Innenraum.</h2>
                <p>Der VW Touran ist eine praktische XL-Option für Familien und kleinere Gruppen und bietet viel Innenraum für eine angenehme Flughafenfahrt.</p>
                <div class="xl-facts"><span class="fact">6 Personen</span><span class="fact">2–4 Koffer</span></div>
                <a class="btn btn-wa xl-conv" href="https://wa.me/491786287358?text=Hallo%20Skyline%20Drive%2C%20ich%20m%C3%B6chte%20den%20XL%20Transfer%20mit%20VW%20Touran%20anfragen." target="_blank" rel="noopener">XL Transfer mit Touran anfragen</a>
              </div>
            </div>
          </section>
          '''
              text = text.replace('<footer>', touran + '\n<footer>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit requested fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html leistungen.html preise.html flotte.html datenschutz.html impressum.html xl-transfer.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix header layout, fleet images and XL Touran"
            git push origin main
          fi
