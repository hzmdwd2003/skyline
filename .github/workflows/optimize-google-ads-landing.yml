name: Optimize Google Ads landing page

on:
  push:
    paths:
      - '.github/workflows/optimize-google-ads-landing.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify homepage for airport transfer ads
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          text = re.sub(r'<title>.*?</title>', '<title>Günstiger Flughafentransfer Frankfurt ab 30 € | Skyline Drive</title>', text, count=1, flags=re.S)
          text = re.sub(r'<meta name="description" content=".*?">', '<meta name="description" content="Stressfreier Flughafentransfer zum und vom Flughafen Frankfurt: ab 30 €, Festpreis vorab, direkte Abholung und schnelle WhatsApp-Anfrage. Auch XL Transfer für Familien und Gruppen.">', text, count=1, flags=re.S)

          css = '''
          <style id="ads-landingpage-focus-20260816">
          .hero{min-height:680px!important}.hero-content{max-width:760px!important;padding:82px 0 132px!important}.hero h1{font-size:clamp(2.45rem,5vw,4.65rem)!important;max-width:820px!important}.hero p{max-width:700px!important;font-size:clamp(1rem,1.55vw,1.18rem)!important}.hero-actions{margin-top:28px!important}.hero-points{margin-top:28px!important;gap:14px 24px!important}.hero-price-badge{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 12px;border-radius:999px;border:1px solid rgba(241,216,145,.28);background:rgba(200,167,95,.12);color:#f1d891;font-size:.88rem;font-weight:900}.trust-strip{margin-top:-54px!important}.trust-item{min-height:128px!important;padding:23px 22px!important}.trust-item strong{font-size:1.18rem!important}.trust-item span{display:block;margin-top:5px;line-height:1.45}.booking.compact-booking{padding:40px 0!important}.compact-booking .section-head h2{font-size:clamp(1.65rem,2.6vw,2.25rem)!important}.fast-proof{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.fast-proof div{padding:14px 15px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.035)}.fast-proof strong{display:block;color:#8b6d24;font-size:.93rem}.fast-proof span{display:block;color:#6b665f;font-size:.78rem;margin-top:2px}.service-grid.ads-focused{grid-template-columns:repeat(2,1fr)!important}.service-grid.ads-focused .service-card{min-height:220px!important}.service-grid.ads-focused .service-card b{margin-bottom:32px!important}.ads-block .section-head h2{font-size:clamp(1.8rem,3.2vw,2.85rem)!important}@media(max-width:980px){.hero{min-height:620px!important}.hero-content{padding:70px 0 118px!important}.fast-proof{grid-template-columns:1fr 1fr}}@media(max-width:680px){.hero{min-height:600px!important}.hero-content{padding:62px 0 112px!important}.hero h1{font-size:clamp(2.1rem,11vw,3.3rem)!important}.hero-actions .btn{width:100%}.hero-points{display:grid!important;gap:8px!important}.trust-strip{margin-top:-34px!important}.service-grid.ads-focused{grid-template-columns:1fr!important}}
          </style>
          '''
          if 'ads-landingpage-focus-20260816' not in text:
              text = text.replace('</head>', css + '\n</head>', 1)

          hero = '''<section class="hero">
                <div class="container hero-content">
                  <span class="eyebrow">Flughafentransfer Frankfurt</span>
                  <h1>Günstig &amp; stressfrei zum <span>Frankfurt Airport.</span></h1>
                  <p>Direkt zum oder vom Flughafen Frankfurt – mit Festpreis vorab und schneller Anfrage per WhatsApp. Für Einzelreisende, Familien und Gruppen. Auch als XL Transfer mit viel Platz für Personen und Gepäck.</p>
                  <div class="hero-price-badge">Flughafentransfer Frankfurt schon ab 30 €</div>
                  <div class="hero-actions">
                    <a class="btn btn-whatsapp" href="https://wa.me/491786287358?text=Hallo%20Skyline%20Drive%2C%20ich%20m%C3%B6chte%20einen%20g%C3%BCnstigen%20Flughafentransfer%20zum%20oder%20vom%20Flughafen%20Frankfurt%20anfragen." target="_blank" rel="noopener">Preis per WhatsApp anfragen</a>
                    <a class="btn btn-outline" href="xl-transfer.html">XL Transfer für Familien &amp; Gruppen</a>
                  </div>
                  <ul class="hero-points"><li>Festpreis vorab</li><li>Direkte Abholung</li><li>Kein Umsteigen</li><li>XL Transfer verfügbar</li></ul>
                </div>
              </section>'''
          text = re.sub(r'<section class="hero">.*?</section>', hero, text, count=1, flags=re.S)

          s = text.find('<div class="trust-strip">')
          e = text.find('<div class="black-transition-gap"', s)
          trust = '''<div class="trust-strip"><div class="container"><div class="trust-grid"><a class="trust-item" href="#kontakt"><strong>Flughafen Frankfurt</strong><span>Direkter Transfer zum oder vom FRA – ab 30 €.</span></a><a class="trust-item" href="#preise"><strong>Festpreis vorab</strong><span>Preis vor der Fahrt kennen und entspannt planen.</span></a><a class="trust-item" href="xl-transfer.html"><strong>Familien &amp; Gruppen</strong><span>Mehr Platz für mehrere Personen und Gepäck.</span></a><a class="trust-item" href="xl-transfer.html"><strong>XL Transfer</strong><span>Mercedes Vito oder VW Touran – je nach Bedarf.</span></a></div></div></div>\n\n    '''
          if s != -1 and e != -1:
              text = text[:s] + trust + text[e:]

          old = '''<span class="eyebrow">Direkte Anfrage</span>
                    <h2>Flughafentransfer unkompliziert anfragen.</h2>
                    <p>
                      Senden Sie uns die wichtigsten Fahrtdaten direkt per WhatsApp. Wir melden uns mit Verfügbarkeit und Festpreis.
                    </p>
                    <p class="small-price-hint"><strong>Flughafentransfer Frankfurt schon ab 30 €.</strong></p>'''
          new = '''<span class="eyebrow">Schnelle Anfrage</span>
                    <h2>In 1 Minute zum persönlichen Festpreis.</h2>
                    <p>Abholort, Ziel, Datum und Personenzahl eintragen. Danach öffnet sich WhatsApp und wir melden uns mit Verfügbarkeit und Festpreis.</p>
                    <div class="fast-proof"><div><strong>ab 30 €</strong><span>Frankfurt Airport</span></div><div><strong>Festpreis</strong><span>vor der Fahrt</span></div><div><strong>Direktfahrt</strong><span>ohne Umsteigen</span></div><div><strong>XL möglich</strong><span>Familien &amp; Gruppen</span></div></div>'''
          text = text.replace(old,new)

          text = text.replace('<span class="eyebrow">Günstige Festpreise</span>\n          <h2>Beliebte Flughafentransfers ab 30 €.</h2>\n          <p>Die folgenden Preise dienen als Orientierung. Ihren persönlichen Festpreis erhalten Sie vor der Fahrt.</p>', '<span class="eyebrow">Günstige Festpreise</span>\n          <h2>Klare Preise. Kein Stress vor der Fahrt.</h2>\n          <p>Beliebte Flughafenstrecken auf einen Blick. Ihren persönlichen Festpreis bestätigen wir vor der Fahrt.</p>')

          services = '''<section id="leistungen"><div class="container"><div class="section-head"><span class="eyebrow">Für jede Flughafenfahrt</span><h2>Einfach die passende Fahrt wählen.</h2><p>Standardtransfer für Einzelreisende und Paare oder XL Transfer für Familien, Gruppen und mehr Gepäck.</p></div><div class="service-grid ads-focused"><a class="service-card" href="#kontakt"><b>01</b><h3>Günstiger Standardtransfer</h3><p>Direkt zum oder vom Flughafen Frankfurt. Festpreis vorab und einfache Anfrage per WhatsApp.</p></a><a class="service-card" href="xl-transfer.html"><b>02</b><h3>XL Transfer</h3><p>Für Familien und Gruppen mit mehr Personen und Gepäck – mit Mercedes Vito oder VW Touran.</p></a><a class="service-card" href="leistungen.html#kindersitz"><b>03</b><h3>Mit Kindersitz</h3><p>Kindersitz oder Sitzerhöhung nach vorheriger Anfrage möglich.</p></a><a class="service-card" href="leistungen.html"><b>04</b><h3>Abholung nach Landung</h3><p>Auch für Fahrten vom Flughafen zu Ihrer Adresse – Flugnummer einfach bei der Anfrage angeben.</p></a></div></div></section>'''
          text = re.sub(r'<section id="leistungen">.*?</section>', services, text, count=1, flags=re.S)

          comfort = '''<section class="ads-block"><div class="container ads-grid"><div class="section-head"><span class="eyebrow">Stressfrei reisen</span><h2>Einsteigen. Zurücklehnen. Direkt zum Flughafen.</h2><p>Keine Parkplatzsuche, kein Umsteigen und keine komplizierte Buchung. Sie teilen uns Ihre Fahrtdaten mit – wir kümmern uns um die passende Fahrt.</p></div><div class="conversion-card"><ul><li><span>Preis</span><strong>vorab als Festpreis</strong></li><li><span>Fahrt</span><strong>direkt ohne Umsteigen</strong></li><li><span>Familien</span><strong>Kindersitz auf Anfrage</strong></li><li><span>Gruppen</span><strong>XL Transfer verfügbar</strong></li><li><span>Anfrage</span><strong>schnell per WhatsApp</strong></li></ul></div></div></section>'''
          text = re.sub(r'<section class="ads-block">.*?</section>', comfort, text, count=1, flags=re.S)

          p.write_text(text,encoding='utf-8')
      - name: Commit homepage optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize homepage for airport transfer ads" || exit 0
          git push
