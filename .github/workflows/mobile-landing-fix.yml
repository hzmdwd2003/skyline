name: Mobile landing page fixes

on:
  push:
    paths:
      - '.github/workflows/mobile-landing-fix.yml'

permissions:
  contents: write

jobs:
  fix-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile-safe typography and spacing
        shell: python
        run: |
          from pathlib import Path

          css = r'''
<style id="mobile-layout-fix-20260816">
@media (max-width: 680px){
  html,body{overflow-x:hidden!important}
  .container,.nav .container{width:min(calc(100% - 24px),1180px)!important}

  .brand{min-width:0!important;max-width:calc(100% - 58px)!important;gap:8px!important}
  .brand-monogram{width:72px!important;height:48px!important;flex:0 0 72px!important}
  .brand-copy{min-width:0!important;overflow:hidden!important}
  .brand strong{
    font-size:.63rem!important;
    line-height:1.15!important;
    letter-spacing:.02em!important;
    white-space:nowrap!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
  }
  .brand-copy>span{
    font-size:.56rem!important;
    line-height:1.2!important;
    letter-spacing:.01em!important;
    white-space:nowrap!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
  }
  .menu-btn{width:42px!important;height:42px!important;flex:0 0 42px!important}

  .page-hero,.ads-landing-hero{padding:38px 0 30px!important}
  .ads-landing-hero .ads-hero-grid{grid-template-columns:1fr!important;gap:22px!important}
  .eyebrow{font-size:.67rem!important;letter-spacing:.11em!important;line-height:1.3!important;flex-wrap:wrap!important}
  .eyebrow::before,.eyebrow:before{width:26px!important}

  h1,.page-hero h1,.ads-landing-hero h1{
    font-size:clamp(1.78rem,8.4vw,2.35rem)!important;
    line-height:1.06!important;
    letter-spacing:-.025em!important;
    overflow-wrap:break-word!important;
    word-break:normal!important;
    hyphens:auto!important;
    margin:13px 0 12px!important;
    max-width:100%!important;
  }
  h2,.section-head h2,.xl-copy h2{
    font-size:clamp(1.45rem,6.8vw,1.95rem)!important;
    line-height:1.1!important;
    letter-spacing:-.02em!important;
    overflow-wrap:break-word!important;
    word-break:normal!important;
    hyphens:auto!important;
  }
  h3{overflow-wrap:break-word!important;word-break:normal!important}
  .ads-lead,.page-hero p,.section-head p,.xl-copy p{font-size:.94rem!important;line-height:1.55!important;max-width:100%!important}

  .ads-benefits,.xl-facts,.meta-inline,.fleet-capacity{gap:7px!important}
  .ads-benefit,.fact,.pill,.fleet-capacity span{font-size:.75rem!important;padding:6px 9px!important;white-space:normal!important}
  .ads-hero-actions{display:grid!important;grid-template-columns:1fr!important;gap:9px!important;width:100%!important}
  .ads-hero-actions>a,.ads-primary-wa,.ads-secondary{width:100%!important;min-width:0!important;white-space:normal!important;text-align:center!important;line-height:1.25!important;padding:12px 14px!important;min-height:48px!important}
  .ads-conversion-card{padding:18px!important;border-radius:20px!important;width:100%!important;min-width:0!important}
  .ads-conversion-card h2{font-size:1.35rem!important}
  .ads-conversion-card .ads-price{font-size:1.85rem!important;overflow-wrap:break-word!important}

  section,.section{padding:50px 0!important}
  .section-head{margin-bottom:25px!important}
  .card-grid,.fleet-grid,.price-layout,.xl-wrap{grid-template-columns:1fr!important;gap:16px!important}
  .card,.fleet-card,.price-main,.xl-image,.conversion-card{min-width:0!important}
  .xl-wrap{column-gap:0!important;row-gap:18px!important}
  .xl-image{padding:12px!important;border-radius:20px!important}
  .xl-image img{height:235px!important;max-height:52vh!important;object-fit:contain!important}
  .xl-copy{padding:4px 0 12px!important}
  #xl-touran{padding-top:46px!important;margin-top:8px!important}

  .route{flex-direction:column!important;align-items:flex-start!important;gap:7px!important;padding:14px!important}
  .route strong{white-space:normal!important}
  .fleet-card img{height:210px!important;object-fit:contain!important}
  .fleet-content{padding:17px!important}
  .fleet-content h3{font-size:1.18rem!important}

  .trust-grid{grid-template-columns:1fr!important}
  .trust-item{min-height:0!important;padding:20px 18px!important}
  .trust-item strong{font-size:1.1rem!important;line-height:1.2!important}

  .form-grid{grid-template-columns:1fr!important}
  .field-full{grid-column:auto!important}
  input,select,textarea{font-size:16px!important}

  .footer-grid{grid-template-columns:1fr!important;display:grid!important;gap:22px!important}
}

@media (max-width: 390px){
  .brand-monogram{width:62px!important;height:44px!important;flex-basis:62px!important}
  .brand strong{font-size:.58rem!important}
  .brand-copy>span{font-size:.51rem!important}
  h1,.page-hero h1,.ads-landing-hero h1{font-size:1.72rem!important}
  h2,.section-head h2,.xl-copy h2{font-size:1.42rem!important}
}
</style>
'''

          pages = ['index.html','leistungen.html','preise.html','flotte.html','xl-transfer.html','datenschutz.html','impressum.html']
          changed=[]
          for name in pages:
              p=Path(name)
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8')
              if 'id="mobile-layout-fix-20260816"' in text:
                  continue
              text=text.replace('</head>', css+'\n</head>',1)
              p.write_text(text,encoding='utf-8')
              changed.append(name)

          if changed:
              import subprocess
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',*changed],check=True)
              subprocess.run(['git','commit','-m','Fix mobile landing page typography and spacing'],check=True)
              subprocess.run(['git','push'],check=True)
