name: Restore header labels

on:
  push:
    paths:
      - '.github/workflows/restore-header-labels.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore desktop header labels while keeping mobile hamburger
        shell: python
        run: |
          from pathlib import Path

          pages = [
              Path('index.html'), Path('leistungen.html'), Path('preise.html'),
              Path('flotte.html'), Path('xl-transfer.html'),
              Path('datenschutz.html'), Path('impressum.html')
          ]

          css = r'''
<style id="restore-header-labels-20260811">
/* Desktop: keep all navigation labels visible. Mobile/tablet: use hamburger menu. */
@media (min-width:981px){
  .menu-btn{display:none!important}
  .nav-links{
    display:flex!important;
    position:static!important;
    inset:auto!important;
    flex-direction:row!important;
    align-items:center!important;
    justify-content:flex-end!important;
    gap:15px!important;
    padding:0!important;
    margin-left:auto!important;
    border:0!important;
    border-radius:0!important;
    background:transparent!important;
    box-shadow:none!important;
    white-space:nowrap!important;
  }
  .nav-links>a{display:inline-flex!important;white-space:nowrap!important;padding:0!important}
  .nav-whatsapp{display:none!important}
}
@media (max-width:980px){
  .menu-btn{display:inline-grid!important;place-items:center!important;flex:0 0 44px!important}
  .nav-inner{min-height:84px!important}
  .nav-links{
    display:none!important;
    position:absolute!important;
    top:84px!important;
    left:17px!important;
    right:17px!important;
    z-index:120!important;
    flex-direction:column!important;
    align-items:stretch!important;
    gap:10px!important;
    padding:18px!important;
    border-radius:18px!important;
    background:#111!important;
    border:1px solid rgba(255,255,255,.12)!important;
    box-shadow:0 20px 50px rgba(0,0,0,.35)!important;
  }
  .nav-links.open{display:flex!important}
  .nav-links>a{display:flex!important;white-space:normal!important;padding:8px 4px!important}
  .nav-whatsapp{display:inline-flex!important}
}
@media (max-width:680px){
  .nav-inner{min-height:76px!important}
  .nav-links{top:76px!important}
}
</style>
'''

          for path in pages:
              text = path.read_text(encoding='utf-8')
              marker = '<style id="restore-header-labels-20260811">'
              if marker in text:
                  continue
              text = text.replace('</head>', css + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html leistungen.html preise.html flotte.html xl-transfer.html datenschutz.html impressum.html
          git commit -m "Restore header navigation labels" || exit 0
          git push
